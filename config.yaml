# Network Router configuration

# Scheduled routing refresh (cron syntax).
# Examples: every 30 minutes ("*/30 * * * *") or hourly ("0 * * * *").
# Leave empty to disable scheduling.
route_refresh_cron: '0 * * * *'
auto_refresh_route: false

# Domains routed through the phone (tethering) connection.
# Wildcards are supported, e.g. '*.internal.com'.
#
# A resolver file covers the whole subtree beneath its name, so 'example.com' and
# '*.example.com' are equivalent here.
