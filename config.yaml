# Interface service keywords (optional; leave commented out for automatic discovery).
# These are service/hardware-port keywords, not device numbers such as en0 or en8.
# wifi_interface_name: "Wi-Fi"
# phone_interface_name: "iPhone USB"
# The iPhone USB service must have a usable IPv4 address and Router on macOS.

# DNS proxy, which is what makes wildcard domains work.
dns_proxy_enabled: true
dns_proxy_port: 5454

# The proxy resolves the domains above over the PHONE path, so name resolution and
# traffic travel the same network.
#
# Upstream preference order:
#   1. the DNS server the phone advertises over DHCP
#   2. dns_upstream_pinned below, each given a /32 route over the phone
#   3. the system resolver (degraded) - still answers, but installs NO routes
#
# Note: routing these resolvers over the phone sends DNS queries over cellular data.
dns_upstream_pinned:
  - 1.1.1.1:53
  - 8.8.8.8:53

# Leave empty to use the order above. Setting a value overrides it entirely.
dns_upstream: ''

# Answer AAAA/HTTPS/SVCB for tethered domains with an empty NOERROR, forcing clients
# onto the A records that the /32 routes cover. Those query types let a client
# connect over an address that is not routed, so disabling this reopens that path.
force_ipv4: true
