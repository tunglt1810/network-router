# IP ranges routed through the phone (tethering) connection.
#
# Bare IP addresses belong here, not in tether_domains: a file in /etc/resolver
# named after an IP address has no effect.
tether_cidrs:
  - '34.2.135.176/32'
  - '94.136.186.73/32'

  # Telegram CIDRs (more reliable than domain resolution)
  - '91.108.4.0/22'
  - '91.108.8.0/22'
  - '91.108.12.0/22'
  - '91.108.16.0/22'
